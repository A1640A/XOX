title = "XOX secret taraması"

[extend]
useDefault = true

[[rules]]
id = "mongodb-connection-string"
description = "MongoDB bağlantı dizesi (kimlik bilgisi içeren)"
regex = '''mongodb(\+srv)?:\/\/[^\s:@]+:[^\s:@]+@'''
tags = ["database", "credentials"]

[allowlist]
description = "Örnek ve doküman dosyaları"
paths = [
  '''\.env\.example$''',
  '''docs/superpowers/specs/.*\.md$''',
  # Plan dokümanı örnek connection string'ler içerir (sahte kimlik bilgileriyle).
  # workflow_dispatch veya schedule ile tam geçmiş taranırsa bunlar yanlış pozitif verir.
  '''docs/superpowers/plans/.*\.md$''',
]
regexes = [
  '''mongodb\+srv://<kullanici>:<sifre>@''',
]
