name: E2E (preview)

# Vercel preview hazır olduğunda tetiklenir — gerçek deploy'a karşı koşar.
on:
  deployment_status:

jobs:
  e2e:
    # Yalnızca PREVIEW deploy'ları. `deployment_status` production için de tetiklenir ve
    # e2e paketi ilk adımda veritabanını SIFIRLIYOR — yanlış tetiklenme veri kaybı demek.
    #
    # ⚠️ 2026-08-25: burası ALLOWLIST'e çevrildi. Önceki hâli iki DENYLIST karşılaştırmasıydı
    # (`!= 'Production' && != 'production'`) ve Vercel `Production – xox` (uzun tire + proje
    # eki) etiketi yollayınca filtre GEÇİLDİ; iş production URL'ine karşı koştu. Yalnızca
    # `apps/e2e/global-setup.ts`'teki veritabanı guard'ı (db !== 'xox_test' ise BLOKE)
    # production veritabanının silinmesini engelledi.
    #
    # Ders: bir kapının izin verdiği şeyi saymak, yasakladığı şeyi saymaktan güvenlidir.
    # Beklenmeyen bir etiket artık ÇALIŞTIRMAZ, atlar.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    env:
      CI: '1'
      E2E_BASE_URL: '${{ github.event.deployment_status.environment_url }}'
      MONGODB_URI: '${{ secrets.MONGODB_URI }}'
      MONGODB_DB: xox_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 11.15.1 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xox/db reset
      - name: "İndeksleri kur (OPS-003 — ensureIndexes'in gerçek çağıranı)"
        # `reset` veritabanını düşürür; indeksler bu YÜZDEN reset SONRASI, seed'den
        # ÖNCE kurulur — hem koleksiyonlar boşken üretim yoluyla (createIndex)
        # oluşturulur hem de seed'in eklediği kullanıcılar email_1 unique'e karşı
        # yazılır (KK-002). Aksi halde KK-117 gibi sondalar preview'da COLLSCAN
        # yapardı ve WS-001 sorguları yanlış ortamı ölçerdi.
        #
        # SEC-002/SEC-005 (güvenlik denetimi): ÖNCEDEN bu adım MIGRATION_SECRET'ı
        # deployment_status.environment_url'e (PR HEAD'inin kodunu çalıştıran
        # preview'a) POST ediyordu — deploy edilen kodu PR yazarı yazar, bir PR
        # route'un ilk satırına isteğin başlıklarını yansıtan bir satır ekleyip
        # sırrı çalabilir, üstüne workflow yanıt gövdesini zaten `cat` ile public
        # Actions log'una basıyordu. `gitForkProtection` fork PR'larını build
        # onayına bağlıyor (severity blocker→major) ama collaborator/entegrasyon
        # yolu açık kalıyordu. ÇÖZÜM: sır ağdan HİÇ geçmez — runner'ın zaten
        # sahip olduğu MONGODB_URI ile `ensureIndexes()` doğrudan çağrılır.
        run: pnpm --filter @xox/db migrate
      - run: pnpm --filter @xox/db seed
      - run: pnpm --filter @xox/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @xox/e2e e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
