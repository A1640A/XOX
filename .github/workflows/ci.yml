name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  playwright-isolation:
    name: Playwright izolasyon kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: apps/e2e dışında playwright bağımlılığı olmamalı
        run: |
          violations=$(grep -rl '"@playwright/test"' --include=package.json \
            --exclude-dir=node_modules --exclude-dir=.git . \
            | grep -v '^\./apps/e2e/package\.json$' || true)
          if [ -n "$violations" ]; then
            echo "🔴 Playwright ana projeye sızmış:"; echo "$violations"; exit 1
          fi
          echo "✅ Playwright yalnızca apps/e2e içinde"

  gates:
    name: Kalite kapıları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 11.15.1 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - name: Yerel MongoDB (tek düğüm replica set) başlat
        # Standalone mongod change stream desteklemiyor; @xox/db ve (ileride)
        # apps/web/lib/realtime'ın change-stream testleri bir replica set
        # ister. `services:` bloğu mongod'a `--replSet` bayrağı geçirmeye
        # izin vermediği için container'ı elle `docker run` ile başlatıp
        # `rs.initiate()`i AÇIKÇA `127.0.0.1:27017` host'una bağlıyoruz —
        # aksi halde üye adresi container hostname'ine düşer ve runner'dan
        # (host ağı) erişilemez, PRIMARY hiç seçilmez.
        run: |
          set -euo pipefail
          docker run -d --name xox-mongo -p 27017:27017 mongo:8 \
            mongod --replSet rs0 --bind_ip_all

          echo "mongod'un ayağa kalkmasını bekle..."
          for i in $(seq 1 60); do
            if docker exec xox-mongo mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then
              echo "mongod hazır ($i. denemede)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "🔴 mongod 60 saniyede ayağa kalkmadı"; docker logs xox-mongo; exit 1
            fi
            sleep 1
          done

          docker exec xox-mongo mongosh --quiet --eval '
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })
          '

          echo "PRIMARY seçilmesini bekle..."
          for i in $(seq 1 60); do
            state=$(docker exec xox-mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null || echo "")
            if [ "$state" = "1" ]; then
              echo "PRIMARY hazır ($i. denemede)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "🔴 replica set 60 saniyede PRIMARY seçmedi"
              docker exec xox-mongo mongosh --quiet --eval 'rs.status()' || true
              exit 1
            fi
            sleep 1
          done
      - name: '.env.local yaz (sır İÇERMEZ — sadece yerel replica set adresi)'
        # `packages/db/src/load-env.ts` `MONGODB_URI` process.env'de ZATEN
        # varsa dosyayı hiç okumadan döner (dokümantasyonu: "CI ortam
        # değişkeni... dokunulmaz") — o yüzden değeri burada job-level `env:`
        # ile değil, geliştiricinin yerelde kullandığı AYNI `.env.local`
        # mekanizmasıyla veriyoruz. Aksi halde loadEnvLocal'ın dosya-okuma
        # dallari (satır ayrıştırma, existsSync vb.) CI'da hiç çalışmaz ve
        # @xox/db'nin branch coverage eşiği (%85) gerçek bir regresyonla
        # değil, salt bu mekanizma farkıyla kırmızıya döner (yerelde ölçülüp
        # doğrulanmıştı — bkz. CI-002 raporu).
        run: |
          cat > .env.local <<'EOF'
          MONGODB_URI=mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          MONGODB_DB=xox_test
          EOF
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm knip
      - name: TypeScript sürüm kilidi (7.x lint katmanını kırar)
        run: |
          v=$(pnpm exec tsc --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          case "$v" in 6.*) echo "✅ TypeScript $v";; *) echo "🔴 Beklenmeyen TypeScript $v"; exit 1;; esac

  mutation:
    name: game-core mutasyon testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 11.15.1 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation

  build:
    name: Derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 11.15.1 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @xox/mobile build
      - run: pnpm exec size-limit

  secrets:
    name: Secret taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
